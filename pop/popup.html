<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishShield</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="card">
      <h1>PhishShield</h1>
      <p class="intro">Check a link for a few common warning signs.</p>

      <form id="scan-form">
        <label for="url-input">Website address</label>
        <input
          id="url-input"
          type="text"
          placeholder="https://example.com"
          autocomplete="url"
          required
        >
        <button type="submit">Check link</button>
      </form>

      <section id="result" class="result" aria-live="polite">
        Enter a link to check it.
      </section>

      <p class="note">
        This is a basic check and cannot guarantee that a link is safe.
      </p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
